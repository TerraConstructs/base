# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: integ-aws-emulator
on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:
    inputs:
      service:
        description: "Run only this service directory under integ/aws (default: all)"
        required: false
        default: ""
jobs:
  integ-aws-emulator:
    name: integ (aws-emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'TerraConstructs/base'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: auto_1e88277c
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.3
      - id: auto_97f0b63c
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.4.4
      - id: auto_e68580bd
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_wrapper: false
          tofu_version: 1.8.2
      - name: Setup OpenTofu plugin cache
        id: setup_opentofu_plugin_cache
        run: |-
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
          echo "TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE=true" >> "$GITHUB_ENV"
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.5.0
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: pnpm i --no-frozen-lockfile
      - name: Compile
        id: compile
        run: pnpm exec projen compile
      - name: Start AWS emulator
        id: emulator
        uses: xSAVIKx/run-aws-emulator@f26496537177fd799f424012f533862a6569d1bd
        with:
          image: ghcr.io/xsavikx/aws-emulator:latest
          memory: 2g
          wait-timeout: "120"
      - name: Run AWS integration tests against aws-emulator
        id: run_aws_integration_tests_against_aws-emulator
        env:
          EMULATOR_SERVICE: ${{ inputs.service }}
          EMULATOR_EXTERNAL: "1"
        run: make -C integ aws-emulator
      - name: Show AWS emulator logs
        id: show_aws_emulator_logs
        if: failure()
        env:
          EMULATOR_CONTAINER: ${{ steps.emulator.outputs.container }}
        run: docker logs "$EMULATOR_CONTAINER"
    timeout-minutes: 300
concurrency:
  group: integ-aws-emulator
  cancel-in-progress: false
